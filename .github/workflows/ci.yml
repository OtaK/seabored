on: [push, pull_request]
name: CI

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true

      - name: Run cargo check
        uses: actions-rs/cargo@v1
        with:
          command: check
          args: --workspace --all-features

      - name: Run cargo check (WASM)
        uses: actions-rs/cargo@v1
        with:
          command: check
          args: --package seabored --all-features --target=wasm32-unknown-unknown

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Run cargo test
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --workspace --all-features

      - name: Run cargo test (derive only)
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --package seabored --no-default-features --features derive

      - name: Run cargo test (serde only)
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --package seabored --no-default-features --features serde

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Run cargo fmt
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

      - name: Run cargo clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --workspace --all-features --all-targets -- -D warnings

      - name: Run rustdoc
        uses: actions-rs/cargo@v1
        with:
          command: doc
          args: --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
